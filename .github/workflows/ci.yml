# Runs on every push and pull request: the same checks as `npm test` and
# `npm run lint`, plus building the Docker image the server runs and trying it.
# On a push to main, once all of that passes, the image is published to
# ghcr.io/graloop/receipt-storage with the tags latest and sha-<short commit>;
# Portainer's re-pull then picks it up.
name: CI

on:
  push:
  pull_request:

# Every action is pinned to the commit of a release (version in the comment):
# a tag like @v3 can be moved to other code, and the image job holds a token
# that publishes what the server runs. Dependabot proposes the updates.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11" # the Dockerfile's version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  frontend:
    name: Frontend formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check "backend/frontend/js/**/*.js"

  docker:
    name: Docker image (published from main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          load: true
          tags: receipt-vault:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A broken image must never reach the server: run it the way the server
      # will, not as root, with a volume, and check a receipt survives a restart.
      - name: Try the image
        run: |
          docker run -d --name smoke -p 8020:8000 -v smoke_data:/data receipt-vault:smoke
          ready() { for _ in $(seq 30); do curl -fs http://127.0.0.1:8020/api/health && return 0; sleep 1; done; docker logs smoke; return 1; }
          ready
          test "$(docker exec smoke id -u)" != "0"
          docker exec smoke python -c "import pillow_heif"
          curl -fs -X POST http://127.0.0.1:8020/api/profiles -H 'Content-Type: application/json' -d '{"name":"Smoke"}'
          curl -fs -X POST http://127.0.0.1:8020/api/receipts/upload -F profile_id=1 -F source=photo -F "files=@backend/tests/fixtures/fake-grocery.png" | grep '"status":"added"'
          docker restart smoke
          ready
          curl -fs http://127.0.0.1:8020/api/receipts | grep '"source":"photo"'
          curl -fs -o /dev/null http://127.0.0.1:8020/api/receipts/1/image
          curl -fs http://127.0.0.1:8020/ | grep -q 'Receipt Vault'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/graloop/receipt-storage
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: env.PUBLISH == 'true'
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
